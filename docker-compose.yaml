services:

  test:
    build:
      context: .
    image: pluggit-api:local
    volumes:
      - .:/app
    command: bash -c "composer install  &&  php vendor/bin/phpunit"

  sample:
    image: pluggit-api:local
    environment:
      PLUGGIT_IP: "${PLUGGIT_IP}"
    volumes:
      - .:/app
    command: bash -c "composer install  &&  php sample.php"

  dev:
    build:
      context: .
    image: pluggit-api:local
    environment:
      PLUGGIT_IP: "${PLUGGIT_IP}"
    volumes:
      - .:/app
    # run an interactive bash shell
    command: bash
    tty: true
    stdin_open: true
